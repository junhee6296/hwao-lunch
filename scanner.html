<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Lunch Check 스캐너 : 화성오산교육청</title>

  <script>
    const originalWarn = console.warn;
    console.warn = (...args) => {
      if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
      originalWarn(...args);
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="icon" href="/img/icon.png?v=20260619-scanner3" type="image/png">
  <link rel="stylesheet" href="CSS/style.css?v=20260619-scanner3">

  <style>
    :root {
      --scanner-box-size: min(62vmin, 430px);
      --scanner-safe-top: max(0.75rem, env(safe-area-inset-top));
      --scanner-safe-right: max(0.75rem, env(safe-area-inset-right));
      --scanner-safe-bottom: max(0.75rem, env(safe-area-inset-bottom));
      --scanner-safe-left: max(0.75rem, env(safe-area-inset-left));
      --scanner-panel-bg: linear-gradient(145deg, rgba(48, 42, 35, 0.90), rgba(24, 31, 29, 0.88));
      --scanner-panel-border: rgba(255, 239, 213, 0.28);
      --scanner-cream: #fff7ea;
      --scanner-apricot: #f2a25f;
      --scanner-coral: #df6c4f;
      --scanner-sage: #92c7a5;
      --scanner-olive: #486b55;
      --scanner-ink: #252823;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #171714;
      color: #fff;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #scanner-dashboard,
    #scanner-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #171714;
    }

    .scanner-info-zone { display: contents; }

    #scanner-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(22,18,14,.26), transparent 21%, transparent 70%, rgba(20,16,12,.38)),
        radial-gradient(circle at center, transparent 42%, rgba(20,18,14,.24) 100%);
    }

    #reader,
    #reader__scan_region {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 100% !important;
      min-height: 100% !important;
      border: 0 !important;
      background: #000 !important;
      overflow: hidden !important;
    }

    #reader { z-index: 1; }

    #reader video {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 100% !important;
      min-height: 100% !important;
      object-fit: cover !important;
      object-position: center center !important;
      border: 0 !important;
      transition: transform .28s ease;
      background: #000;
    }

    #reader__dashboard,
    #reader__dashboard_section,
    #reader__dashboard_section_csr,
    #reader__header_message,
    #reader__status_span,
    #reader__camera_permission_button,
    #reader__filescan_input,
    #reader img[alt="Info icon"] {
      display: none !important;
    }

    #qr-shaded-region {
      border: 0 !important;
      box-shadow: none !important;
    }

    .scanner-control-bar {
      position: fixed;
      top: var(--scanner-safe-top);
      left: var(--scanner-safe-left);
      right: var(--scanner-safe-right);
      z-index: 90;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: .6rem;
      pointer-events: none;
    }

    .scanner-control-bar > * { pointer-events: auto; }

    .scanner-link-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: .48rem;
      min-width: 0;
    }

    .scanner-top-btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .38rem;
      padding: .68rem .88rem;
      border-radius: .95rem;
      border: 1px solid rgba(255,255,255,.34);
      white-space: nowrap;
      font-size: .82rem;
      line-height: 1;
      font-weight: 900;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 9px 24px rgba(0,0,0,.28);
      transition: transform .14s ease, opacity .14s ease, filter .14s ease;
    }

    .scanner-top-btn:hover { filter: brightness(1.06); }
    .scanner-top-btn:active { transform: scale(.96); }
    .scanner-top-btn:disabled,
    .scanner-top-btn.is-switching { opacity: .55; cursor: wait; }

    .scanner-flip-btn {
      color: #4a3527;
      background: rgba(255,247,234,.95);
      border-color: rgba(255,255,255,.78);
    }

    .scanner-qr-btn {
      color: #fff;
      background: linear-gradient(135deg, rgba(226,108,79,.96), rgba(242,148,78,.94));
      border-color: rgba(255,220,183,.72);
    }

    .scanner-admin-btn {
      color: #fff;
      background: linear-gradient(135deg, rgba(72,107,85,.96), rgba(42,70,57,.96));
      border-color: rgba(184,222,196,.58);
    }

    .scan-guide {
      position: fixed;
      z-index: 30;
      left: 50%;
      top: 50%;
      width: var(--scanner-box-size) !important;
      height: var(--scanner-box-size) !important;
      min-width: var(--scanner-box-size) !important;
      min-height: var(--scanner-box-size) !important;
      max-width: var(--scanner-box-size) !important;
      max-height: var(--scanner-box-size) !important;
      aspect-ratio: 1 / 1;
      flex: 0 0 var(--scanner-box-size);
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255,247,234,.92);
      border-radius: clamp(18px, 4vmin, 34px);
      box-sizing: border-box;
      box-shadow:
        0 0 0 9999px rgba(23,20,16,.54),
        0 0 0 1px rgba(0,0,0,.4),
        0 12px 46px rgba(0,0,0,.35),
        inset 0 0 28px rgba(255,255,255,.08);
      pointer-events: none;
      contain: strict;
    }

    .scan-guide::before,
    .scan-guide::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: inherit;
      pointer-events: none;
    }

    .scan-guide::before {
      background:
        linear-gradient(var(--scanner-cream),var(--scanner-cream)) left top / 29% 5px no-repeat,
        linear-gradient(var(--scanner-cream),var(--scanner-cream)) left top / 5px 29% no-repeat,
        linear-gradient(var(--scanner-cream),var(--scanner-cream)) right top / 29% 5px no-repeat,
        linear-gradient(var(--scanner-cream),var(--scanner-cream)) right top / 5px 29% no-repeat,
        linear-gradient(var(--scanner-cream),var(--scanner-cream)) left bottom / 29% 5px no-repeat,
        linear-gradient(var(--scanner-cream),var(--scanner-cream)) left bottom / 5px 29% no-repeat,
        linear-gradient(var(--scanner-cream),var(--scanner-cream)) right bottom / 29% 5px no-repeat,
        linear-gradient(var(--scanner-cream),var(--scanner-cream)) right bottom / 5px 29% no-repeat;
      filter: drop-shadow(0 0 6px rgba(0,0,0,.38));
    }

    .scan-guide::after {
      inset: 8px;
      border: 1px solid rgba(255,255,255,.15);
    }

    .scanner-glass-panel {
      z-index: 70;
      overflow: hidden;
      border: 1px solid var(--scanner-panel-border);
      border-radius: 1rem;
      background: var(--scanner-panel-bg);
      color: #fff;
      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);
      box-shadow: 0 16px 38px rgba(18,14,10,.34), inset 0 1px 0 rgba(255,255,255,.06);
    }

    .scanner-menu-panel {
      position: fixed;
      left: var(--scanner-safe-left);
      top: 50%;
      width: clamp(230px, 25vw, 350px);
      max-height: min(52vh, 470px);
      transform: translateY(-48%);
    }

    .scanner-attendee-panel {
      position: fixed;
      right: var(--scanner-safe-right);
      top: calc(var(--scanner-safe-top) + 3.9rem);
      bottom: var(--scanner-safe-bottom);
      width: clamp(205px, 23vw, 320px);
      display: flex;
      flex-direction: column;
    }

    .scanner-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .55rem;
      padding: .75rem .85rem;
      border-bottom: 1px solid rgba(255,255,255,.14);
      background: linear-gradient(90deg, rgba(226,108,79,.17), rgba(146,199,165,.10));
    }

    .scanner-panel-title {
      margin: 0;
      color: #fff;
      font-size: .86rem;
      line-height: 1.2;
      font-weight: 900;
    }

    .scanner-panel-meta {
      color: rgba(226,232,240,.72);
      font-size: .65rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .scanner-menu-content {
      max-height: calc(min(52vh, 470px) - 50px);
      overflow-y: auto;
      padding: 1rem 1.05rem 1.15rem;
      overscroll-behavior: contain;
    }

    .scanner-menu-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: .55rem;
    }

    .scanner-menu-list li {
      position: relative;
      padding-left: .72rem;
      color: rgba(255,249,240,.97);
      font-size: .88rem;
      line-height: 1.35;
      font-weight: 800;
      word-break: keep-all;
    }

    .scanner-menu-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--scanner-apricot);
    }

    .scanner-menu-empty {
      color: rgba(226,232,240,.68);
      font-size: .76rem;
      line-height: 1.45;
      font-weight: 700;
    }

    .scanner-menu-holiday {
      color: #ff8b72;
      font-size: 1rem;
      font-weight: 900;
    }

    .scanner-attendee-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .scanner-attendee-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: .65rem;
      padding: .63rem .78rem;
      border-bottom: 1px solid rgba(255,255,255,.11);
    }

    .scanner-attendee-name {
      overflow: hidden;
      color: #fff;
      font-size: .82rem;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scanner-attendee-time {
      color: #a8e2b9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: .7rem;
      font-weight: 800;
    }

    .scanner-attendee-empty {
      padding: 1.2rem .8rem;
      color: rgba(226,232,240,.64);
      font-size: .75rem;
      font-weight: 700;
      text-align: center;
    }

    .scanner-mini-stats {
      position: fixed;
      left: var(--scanner-safe-left);
      bottom: var(--scanner-safe-bottom);
      z-index: 76;
      width: clamp(210px, 19vw, 280px);
      display: grid;
      grid-template-columns: 1fr;
      align-items: stretch;
      overflow: hidden;
      border: 1px solid rgba(255,239,213,.32);
      border-radius: 1.15rem;
      background: linear-gradient(155deg, rgba(55,46,37,.92), rgba(36,48,42,.90));
      color: #fff;
      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);
      box-shadow: 0 15px 34px rgba(18,14,10,.34), inset 0 1px 0 rgba(255,255,255,.08);
    }

    .scanner-stat-item {
      min-width: 0;
      padding: .8rem 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .scanner-stat-item:first-child {
      padding-top: .9rem;
      padding-bottom: .72rem;
      background: linear-gradient(90deg, rgba(242,162,95,.16), transparent);
    }

    .scanner-stat-item + .scanner-stat-item {
      border-top: 1px solid rgba(255,255,255,.15);
      padding-top: .68rem;
      padding-bottom: .78rem;
    }

    .scanner-stat-label {
      display: block;
      color: rgba(255,239,220,.72);
      font-size: .69rem;
      line-height: 1;
      font-weight: 800;
      margin-bottom: .4rem;
    }

    .scanner-stat-value {
      display: block;
      overflow: hidden;
      color: #fff;
      font-size: 1.15rem;
      line-height: 1.1;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scanner-stat-item:first-child .scanner-stat-value {
      color: #ffd3aa;
      font-size: clamp(1.65rem, 2.6vw, 2.15rem);
      letter-spacing: -.03em;
    }

    .scanner-stat-item:last-child .scanner-stat-value {
      color: #d9f2df;
      font-size: clamp(1rem, 1.5vw, 1.25rem);
    }

    #scan-result-panel {
      position: fixed;
      left: 50%;
      bottom: var(--scanner-safe-bottom);
      z-index: 78;
      width: min(460px, calc(100vw - 2rem));
      padding: .82rem 1rem;
      transform: translateX(-50%);
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 1.1rem;
      background: rgba(255,248,238,.94);
      color: #3c332a;
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 14px 36px rgba(0,0,0,.28);
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    #scan-result-panel[data-state="working"] { background: rgba(255,248,238,.96); border-color: rgba(242,162,95,.72); }
    #scan-result-panel[data-state="success"] { background: rgba(239,250,241,.96); border-color: rgba(72,107,85,.78); }
    #scan-result-panel[data-state="success"] #scan-msg { color: #356449; }
    #scan-result-panel[data-state="fail"] { background: rgba(255,241,235,.97); border-color: rgba(223,108,79,.78); }
    #scan-result-panel[data-state="fail"] #scan-msg { color: #c44f37; }

    #scan-msg {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.35rem);
      line-height: 1.2;
      font-weight: 900;
    }

    #scan-sub-msg {
      margin: .22rem 0 0;
      color: #64748b;
      font-size: clamp(.72rem, 1.7vw, .88rem);
      line-height: 1.25;
      font-weight: 700;
    }

    @media (max-width: 900px) and (min-width: 681px) {
      .scanner-menu-panel {
        top: calc(var(--scanner-safe-top) + 4rem);
        width: min(41vw, 245px);
        max-height: 36vh;
        transform: none;
      }

      .scanner-attendee-panel {
        top: calc(var(--scanner-safe-top) + 4rem);
        bottom: auto;
        width: min(41vw, 245px);
        max-height: 36vh;
      }

      .scanner-menu-content { max-height: calc(36vh - 46px); }
      .scanner-attendee-list { max-height: calc(36vh - 46px); }
      .scanner-mini-stats { width: min(250px, 30vw); }
      #scan-result-panel { bottom: calc(var(--scanner-safe-bottom) + 7.5rem); width: min(420px, calc(100vw - 1.5rem)); }
    }

    @media (max-width: 680px) {
      html,
      body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: auto;
        background: #f7f0e7;
      }

      body {
        position: static;
        inset: auto;
        touch-action: manipulation;
        user-select: auto;
        -webkit-user-select: auto;
      }

      #scanner-dashboard {
        position: relative;
        inset: auto;
        width: 100%;
        height: auto;
        overflow: visible;
        background: linear-gradient(180deg, #1c1c18 0, #1c1c18 100svh, #f7f0e7 100svh, #eef3ec 100%);
      }

      #scanner-stage {
        position: relative;
        inset: auto;
        width: 100%;
        height: 100svh;
        min-height: 560px;
        overflow: hidden;
        background: #171714;
      }

      #reader,
      #reader__scan_region { position: absolute !important; }

      .scanner-control-bar {
        position: absolute;
        top: var(--scanner-safe-top);
      }

      .scanner-top-btn {
        min-height: 38px;
        padding: .56rem .62rem;
        border-radius: .82rem;
        font-size: .7rem;
      }

      .scanner-link-actions { gap: .32rem; }

      .scan-guide {
        position: absolute;
        top: 47%;
        --scanner-box-size: min(69vw, 43vh, 330px);
      }

      #scan-result-panel {
        position: absolute;
        left: .75rem;
        right: .75rem;
        bottom: max(.8rem, env(safe-area-inset-bottom));
        width: auto;
        transform: none;
        padding: .78rem .8rem;
      }

      .scanner-info-zone {
        position: relative;
        z-index: 110;
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 1.1rem .9rem calc(1.5rem + env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 10% 0%, rgba(242,162,95,.13), transparent 34%),
          radial-gradient(circle at 90% 16%, rgba(146,199,165,.17), transparent 38%),
          linear-gradient(180deg, #fbf6ef, #eef3ec);
      }

      .scanner-menu-panel,
      .scanner-attendee-panel,
      .scanner-mini-stats {
        position: static;
        inset: auto;
        width: 100%;
        max-width: none;
        max-height: none;
        transform: none;
        order: initial;
      }

      .scanner-glass-panel,
      .scanner-mini-stats {
        color: #2e2d28;
        border-color: rgba(120,94,65,.16);
        background: rgba(255,255,255,.90);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 12px 30px rgba(86,62,39,.10), inset 0 1px 0 rgba(255,255,255,.9);
      }

      .scanner-mini-stats {
        order: 1;
        border-radius: 1.3rem;
      }

      .scanner-menu-panel {
        order: 2;
        min-height: 260px;
      }

      .scanner-attendee-panel {
        order: 3;
        min-height: 300px;
      }

      .scanner-panel-head {
        padding: .95rem 1rem;
        border-bottom-color: rgba(91,74,56,.12);
        background: linear-gradient(90deg, rgba(242,162,95,.14), rgba(146,199,165,.12));
      }

      .scanner-panel-title {
        color: #312b25;
        font-size: 1rem;
      }

      .scanner-panel-meta {
        color: #7c6551;
        font-size: .72rem;
      }

      .scanner-menu-content {
        max-height: none;
        overflow: visible;
        padding: 1.05rem 1.1rem 1.2rem;
      }

      .scanner-menu-list { gap: .72rem; }

      .scanner-menu-list li {
        color: #342f2a;
        font-size: .96rem;
        line-height: 1.45;
        padding-left: .9rem;
      }

      .scanner-menu-list li::before { color: #dd754f; }
      .scanner-menu-empty { color: #7d756d; font-size: .88rem; }
      .scanner-menu-holiday { color: #c44f37; }

      .scanner-attendee-list {
        min-height: 230px;
        max-height: 48vh;
        overflow-y: auto;
      }

      .scanner-attendee-row {
        padding: .82rem 1rem;
        border-bottom-color: rgba(91,74,56,.10);
      }

      .scanner-attendee-name {
        color: #2c2c28;
        font-size: .9rem;
      }

      .scanner-attendee-time {
        color: #3f7653;
        font-size: .75rem;
      }

      .scanner-attendee-empty { color: #7d756d; }

      .scanner-stat-item { padding: .9rem 1.05rem; }
      .scanner-stat-item + .scanner-stat-item { border-top-color: rgba(91,74,56,.12); }
      .scanner-stat-label { color: #816b56; font-size: .76rem; }
      .scanner-stat-item:first-child { background: linear-gradient(90deg, rgba(242,162,95,.14), rgba(255,255,255,0)); }
      .scanner-stat-item:first-child .scanner-stat-value { color: #c55f3e; font-size: 2.2rem; }
      .scanner-stat-item:last-child .scanner-stat-value { color: #3d684d; font-size: 1.25rem; }
    }

    @media (orientation: landscape) and (max-height: 620px) and (min-width: 681px) {
      .scanner-menu-panel { top: 50%; transform: translateY(-48%); max-height: 49vh; }
      .scanner-menu-content { max-height: calc(49vh - 46px); }
      .scanner-attendee-panel { top: calc(var(--scanner-safe-top) + 3.6rem); bottom: var(--scanner-safe-bottom); max-height: none; }
      .scanner-attendee-list { max-height: none; }
      .scanner-mini-stats { width: min(255px, 22vw); }
      #scan-result-panel { left: 50%; right: auto; bottom: var(--scanner-safe-bottom); width: min(390px, 38vw); transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <div id="scanner-dashboard">
    <main id="scanner-stage" aria-label="Lunch Check QR 스캐너">
      <div id="reader"></div>
      <div class="scan-guide" aria-hidden="true"></div>

      <div class="scanner-control-bar">
        <button id="custom-flip-btn" type="button" class="scanner-top-btn scanner-flip-btn" aria-label="후면 카메라로 전환">
          <span aria-hidden="true">🔄</span>
          <span>전면/후면 전환</span>
        </button>

        <div class="scanner-link-actions">
          <a href="/qr.html" class="scanner-top-btn scanner-qr-btn">
            <span aria-hidden="true">📱</span>
            <span>QR 발급</span>
          </a>
          <a href="/admin.html" class="scanner-top-btn scanner-admin-btn">
            <span aria-hidden="true">🔐</span>
            <span>관리자</span>
          </a>
        </div>
      </div>

      <div id="scan-result-panel" data-state="idle" role="status" aria-live="polite">
        <p id="scan-msg">QR 코드를 보여주세요</p>
        <p id="scan-sub-msg">인식 시 자동으로 식사 처리됩니다</p>
      </div>
    </main>

    <section class="scanner-info-zone" aria-label="스캐너 부가 정보">
      <aside class="scanner-glass-panel scanner-menu-panel" aria-label="오늘의 식단표">
        <div class="scanner-panel-head">
          <h2 class="scanner-panel-title">🍱 오늘의 식단표</h2>
          <span id="scanner-menu-date" class="scanner-panel-meta"></span>
        </div>
        <div class="scanner-menu-content">
          <ul id="scanner-menu-list" class="scanner-menu-list"></ul>
          <p id="scanner-menu-empty" class="scanner-menu-empty">식단을 불러오는 중입니다.</p>
        </div>
      </aside>

      <aside class="scanner-glass-panel scanner-attendee-panel" aria-label="실시간 식사 명단">
        <div class="scanner-panel-head">
          <h2 class="scanner-panel-title">📋 실시간 식사 명단</h2>
          <span id="scanner-attendee-count" class="scanner-panel-meta">0명</span>
        </div>
        <div id="scanner-attendee-list" class="scanner-attendee-list">
          <p class="scanner-attendee-empty">아직 식사자가 없습니다.</p>
        </div>
      </aside>

      <section class="scanner-mini-stats" aria-label="오늘 식수 현황">
        <div class="scanner-stat-item">
          <span class="scanner-stat-label">오늘 식수</span>
          <strong id="stat-count" class="scanner-stat-value">0명</strong>
        </div>
        <div class="scanner-stat-item">
          <span class="scanner-stat-label">최근 식사자</span>
          <strong id="recent-diner" class="scanner-stat-value">없음</strong>
        </div>
      </section>

    </section>
  </div>

  <script type="module" src="JS/scanner_app.js?v=20260619-scanner-rework3"></script>

    import CameraManager from './JS/camera.js?v=20260619-scanner-rework3';

  </script>
