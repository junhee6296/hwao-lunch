<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>밥Check 스캐너 : 화성오산교육청</title>

  <script>
    const originalWarn = console.warn;
    console.warn = (...args) => {
      if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
      originalWarn(...args);
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="icon" href="/img/icon.png" type="image/png">
  <link rel="stylesheet" href="CSS/style.css">

  <style>
    #reader { width: 100% !important; height: 100% !important; border: none !important; background: black; }
    #reader__scan_region { width: 100% !important; height: 100% !important; }
    #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; transition: transform 0.3s ease; }
    .scanner-control-bar {
      position: absolute;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      z-index: 60;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: .75rem;
      pointer-events: none;
    }
    .scanner-control-bar > * { pointer-events: auto; }
    .scanner-link-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .5rem; }
    .scanner-top-btn { min-height: 40px; white-space: nowrap; }
    @media (max-width: 640px) {
      .scanner-control-bar { top: .75rem; left: .75rem; right: .75rem; align-items: stretch; }
      .scanner-top-btn { font-size: 12px !important; padding: .55rem .7rem !important; border-radius: .85rem !important; }
      .scanner-link-actions { flex: 1; }
      .scanner-link-actions a { flex: 1; justify-content: center; }
    }
    @media (max-width: 420px) {
      .scanner-control-bar { flex-direction: column; }
      .scanner-link-actions { width: 100%; }
    }
  </style>
</head>
<body class="bg-gray-100">
  <div id="scanner-dashboard" class="min-h-screen lg:h-screen flex flex-col bg-gray-100">
    <main class="flex-1 flex flex-col lg:flex-row gap-4 lg:gap-6 p-4 lg:p-6 min-h-0 overflow-auto lg:overflow-hidden">
      <section class="flex-1 flex flex-col gap-4 min-h-[620px] lg:min-h-0">
        <div class="bg-black rounded-3xl shadow-lg border border-gray-200 flex-1 relative overflow-hidden flex items-center justify-center">
          <div class="scanner-control-bar">
            <button id="custom-flip-btn" class="scanner-top-btn bg-white/90 text-gray-800 px-3 py-2 rounded-xl shadow-md text-sm font-bold flex items-center gap-1 backdrop-blur active:scale-95 transition-transform hover:bg-gray-100">
              🔄 전면/후면 전환
            </button>
            <div class="scanner-link-actions">
              <a href="/qr.html" class="scanner-top-btn bg-white/90 hover:bg-white text-gray-700 font-bold py-2 px-4 rounded-xl shadow-md text-sm flex items-center gap-1 backdrop-blur transition">📱 QR 발급</a>
              <a href="/admin.html" class="scanner-top-btn bg-gray-900/90 hover:bg-black text-white font-bold py-2 px-4 rounded-xl shadow-md text-sm flex items-center gap-1 backdrop-blur transition">🔐 관리자</a>
            </div>
          </div>

          <div id="reader" class="w-full h-full"></div>

          <div id="scan-result-panel" class="absolute bottom-6 left-1/2 -translate-x-1/2 w-11/12 max-w-md p-4 text-center rounded-2xl bg-white/95 backdrop-blur shadow-2xl z-50 transition-all border-4 border-transparent">
             <p id="scan-msg" class="text-xl lg:text-2xl font-bold text-gray-700">QR 코드를 보여주세요</p>
             <p id="scan-sub-msg" class="text-sm text-gray-500 mt-1">인식 시 자동으로 식사 명단에 등록됩니다</p>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 shrink-0">
          <div class="bg-white p-5 lg:p-6 rounded-2xl shadow-md border-b-4 border-green-500">
            <p class="text-gray-500 font-bold">오늘 현재 식수</p>
            <h3 id="stat-count" class="text-4xl lg:text-5xl font-black text-gray-900 mt-2">0명</h3>
          </div>
          <div class="bg-white p-5 lg:p-6 rounded-2xl shadow-md border-b-4 border-blue-500">
            <p class="text-gray-500 font-bold">최근 식사자</p>
            <h3 id="recent-diner" class="text-xl lg:text-2xl font-bold text-blue-600 mt-2 truncate">-</h3>
          </div>
        </div>
      </section>

      <aside class="w-full lg:w-1/3 bg-white rounded-3xl shadow-lg border border-gray-200 flex flex-col shrink-0 lg:shrink overflow-hidden h-[560px] lg:h-auto">
        <div class="p-5 lg:p-6 border-b border-gray-100 bg-gray-50 shrink-0">
          <div class="flex flex-col gap-3">
            <h2 class="text-2xl font-black text-gray-800">📋 실시간 식사 명단</h2>
            <div class="flex flex-wrap gap-2 items-center">
              <input type="date" id="date-selector" class="bg-blue-50 border border-blue-100 text-blue-800 font-bold py-2 px-3 rounded-xl outline-none">
              <button id="btn-refresh-diners" class="bg-gray-900 hover:bg-black text-white font-bold py-2 px-4 rounded-xl shadow-sm">조회</button>
            </div>
          </div>
        </div>
        <div class="flex-1 overflow-y-auto">
          <table class="w-full text-left">
            <thead class="bg-gray-50 sticky top-0">
              <tr>
                <th class="p-4 font-bold text-gray-600 border-b">이름</th>
                <th class="p-4 font-bold text-gray-600 border-b text-center">시간</th>
              </tr>
            </thead>
            <tbody id="diner-table-body" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="JS/scanner_app.js?v=20260609"></script>
  <script type="module">
      import CameraManager from './JS/camera.js?v=20260609';
      document.getElementById('custom-flip-btn')?.addEventListener('click', () => CameraManager.toggleCamera());
  </script>
</body>
</html>
