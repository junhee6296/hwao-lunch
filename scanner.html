<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Lunch Check 스캐너 : 화성오산교육청</title>

  <script>
    const originalWarn = console.warn;
    console.warn = (...args) => {
      if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
      originalWarn(...args);
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="icon" href="/img/icon.png?v=20260619-scanner" type="image/png">
  <link rel="stylesheet" href="CSS/style.css?v=20260619-scanner">

  <style>
    :root {
      --scanner-box-size: min(62vmin, 420px);
      --scanner-safe-top: max(0.75rem, env(safe-area-inset-top));
      --scanner-safe-right: max(0.75rem, env(safe-area-inset-right));
      --scanner-safe-bottom: max(0.75rem, env(safe-area-inset-bottom));
      --scanner-safe-left: max(0.75rem, env(safe-area-inset-left));
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #scanner-dashboard,
    #scanner-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #scanner-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.24), transparent 24%, transparent 72%, rgba(0,0,0,.3)),
        radial-gradient(circle at center, transparent 48%, rgba(0,0,0,.22) 100%);
    }

    #reader,
    #reader__scan_region {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 100% !important;
      min-height: 100% !important;
      border: 0 !important;
      background: #000 !important;
      overflow: hidden !important;
    }

    #reader {
      z-index: 1;
    }

    #reader video {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 100% !important;
      min-height: 100% !important;
      object-fit: cover !important;
      object-position: center center !important;
      border: 0 !important;
      transition: transform .28s ease;
      background: #000;
    }

    #reader__dashboard,
    #reader__dashboard_section,
    #reader__dashboard_section_csr,
    #reader__header_message,
    #reader__status_span,
    #reader__camera_permission_button,
    #reader__filescan_input,
    #reader img[alt="Info icon"] {
      display: none !important;
    }

    #qr-shaded-region {
      border: 0 !important;
      box-shadow: none !important;
    }

    .scanner-control-bar {
      position: fixed;
      top: var(--scanner-safe-top);
      left: var(--scanner-safe-left);
      right: var(--scanner-safe-right);
      z-index: 80;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: .55rem;
      pointer-events: none;
    }

    .scanner-control-bar > * {
      pointer-events: auto;
    }

    .scanner-link-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: .45rem;
      min-width: 0;
    }

    .scanner-top-btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      padding: .62rem .82rem;
      border-radius: .9rem;
      border: 1px solid rgba(255,255,255,.25);
      white-space: nowrap;
      font-size: .82rem;
      line-height: 1;
      font-weight: 800;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 22px rgba(0,0,0,.25);
      transition: transform .14s ease, opacity .14s ease, background .14s ease;
    }

    .scanner-top-btn:active {
      transform: scale(.96);
    }

    .scanner-top-btn:disabled,
    .scanner-top-btn.is-switching {
      opacity: .55;
      cursor: wait;
    }

    .scan-guide {
      position: fixed;
      z-index: 30;
      left: 50%;
      top: 50%;
      width: var(--scanner-box-size);
      height: var(--scanner-box-size);
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255,255,255,.78);
      border-radius: clamp(18px, 4vmin, 34px);
      box-shadow:
        0 0 0 9999px rgba(0,0,0,.08),
        0 0 0 1px rgba(0,0,0,.25),
        0 10px 42px rgba(0,0,0,.24),
        inset 0 0 24px rgba(255,255,255,.1);
      pointer-events: none;
    }

    .scan-guide::before,
    .scan-guide::after {
      content: '';
      position: absolute;
      width: 30%;
      height: 30%;
      pointer-events: none;
    }

    .scan-guide::before {
      left: -3px;
      top: -3px;
      border-left: 5px solid #fff;
      border-top: 5px solid #fff;
      border-radius: 18px 0 0 0;
    }

    .scan-guide::after {
      right: -3px;
      bottom: -3px;
      border-right: 5px solid #fff;
      border-bottom: 5px solid #fff;
      border-radius: 0 0 18px 0;
    }

    .scanner-mini-stats {
      position: fixed;
      left: var(--scanner-safe-left);
      bottom: var(--scanner-safe-bottom);
      z-index: 70;
      display: flex;
      align-items: stretch;
      max-width: min(330px, 48vw);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 1rem;
      background: rgba(15,23,42,.72);
      color: #fff;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 30px rgba(0,0,0,.28);
    }

    .scanner-stat-item {
      min-width: 0;
      padding: .6rem .78rem;
    }

    .scanner-stat-item + .scanner-stat-item {
      border-left: 1px solid rgba(255,255,255,.16);
    }

    .scanner-stat-label {
      display: block;
      color: rgba(226,232,240,.76);
      font-size: .68rem;
      line-height: 1;
      font-weight: 800;
      margin-bottom: .32rem;
    }

    .scanner-stat-value {
      display: block;
      max-width: 140px;
      overflow: hidden;
      color: #fff;
      font-size: 1rem;
      line-height: 1.1;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #scan-result-panel {
      position: fixed;
      left: 50%;
      bottom: var(--scanner-safe-bottom);
      z-index: 75;
      width: min(460px, calc(100vw - 2rem));
      padding: .82rem 1rem;
      transform: translateX(-50%);
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 1.1rem;
      background: rgba(255,255,255,.9);
      color: #1f2937;
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 14px 36px rgba(0,0,0,.26);
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    #scan-result-panel[data-state="working"] {
      background: rgba(248,250,252,.94);
      border-color: rgba(148,163,184,.75);
    }

    #scan-result-panel[data-state="success"] {
      background: rgba(236,253,245,.94);
      border-color: rgba(34,197,94,.78);
    }

    #scan-result-panel[data-state="success"] #scan-msg {
      color: #15803d;
    }

    #scan-result-panel[data-state="fail"] {
      background: rgba(254,242,242,.95);
      border-color: rgba(239,68,68,.76);
    }

    #scan-result-panel[data-state="fail"] #scan-msg {
      color: #dc2626;
    }

    #scan-msg {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.35rem);
      line-height: 1.2;
      font-weight: 900;
    }

    #scan-sub-msg {
      margin: .22rem 0 0;
      color: #64748b;
      font-size: clamp(.72rem, 1.7vw, .88rem);
      line-height: 1.25;
      font-weight: 700;
    }

    @media (max-width: 700px) {
      .scanner-top-btn {
        min-height: 38px;
        padding: .56rem .65rem;
        border-radius: .78rem;
        font-size: .72rem;
      }

      .scanner-mini-stats {
        max-width: calc(100vw - 1.5rem);
      }

      .scanner-stat-item {
        padding: .52rem .65rem;
      }

      .scanner-stat-value {
        max-width: 110px;
        font-size: .9rem;
      }

      #scan-result-panel {
        bottom: calc(var(--scanner-safe-bottom) + 4.7rem);
        width: calc(100vw - 1.5rem);
        padding: .72rem .85rem;
      }
    }

    @media (max-width: 390px) {
      .scanner-top-btn {
        gap: .22rem;
        padding-inline: .52rem;
        font-size: .67rem;
      }

      .scanner-link-actions {
        gap: .3rem;
      }

      .scanner-stat-label {
        font-size: .62rem;
      }

      .scanner-stat-value {
        max-width: 88px;
        font-size: .84rem;
      }
    }

    @media (orientation: landscape) and (max-height: 620px) {
      .scanner-mini-stats {
        max-width: 42vw;
      }

      #scan-result-panel {
        left: auto;
        right: var(--scanner-safe-right);
        bottom: var(--scanner-safe-bottom);
        width: min(360px, 45vw);
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div id="scanner-dashboard">
    <main id="scanner-stage" aria-label="Lunch Check QR 스캐너">
      <div id="reader"></div>
      <div class="scan-guide" aria-hidden="true"></div>

      <div class="scanner-control-bar">
        <button id="custom-flip-btn" type="button" class="scanner-top-btn bg-white/88 text-slate-800 hover:bg-white" aria-label="후면 카메라로 전환">
          <span aria-hidden="true">🔄</span>
          <span>전면/후면 전환</span>
        </button>

        <div class="scanner-link-actions">
          <a href="/qr.html" class="scanner-top-btn bg-white/88 text-slate-700 hover:bg-white">
            <span aria-hidden="true">📱</span>
            <span>QR 발급</span>
          </a>
          <a href="/admin.html" class="scanner-top-btn bg-slate-950/82 text-white hover:bg-black">
            <span aria-hidden="true">🔐</span>
            <span>관리자</span>
          </a>
        </div>
      </div>

      <section class="scanner-mini-stats" aria-label="오늘 식수 현황">
        <div class="scanner-stat-item">
          <span class="scanner-stat-label">오늘 식수</span>
          <strong id="stat-count" class="scanner-stat-value">0명</strong>
        </div>
        <div class="scanner-stat-item">
          <span class="scanner-stat-label">최근 식사자</span>
          <strong id="recent-diner" class="scanner-stat-value">없음</strong>
        </div>
      </section>

      <div id="scan-result-panel" data-state="idle" role="status" aria-live="polite">
        <p id="scan-msg">QR 코드를 보여주세요</p>
        <p id="scan-sub-msg">인식 시 자동으로 식사 처리됩니다</p>
      </div>
    </main>
  </div>

  <script type="module" src="JS/scanner_app.js?v=20260619-scanner-rework"></script>
  <script type="module">
    import CameraManager from './JS/camera.js?v=20260619-scanner-rework';
    document.getElementById('custom-flip-btn')?.addEventListener('click', () => CameraManager.toggleCamera());
  </script>
</body>
</html>
