<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>밥Check : 점심 QR</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/img/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/icon.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="CSS/style.css">

  <style>
    :root {
      --primary-color: #f59e0b;
      --primary-dark: #92400e;
      --warm-cream: #fff7d1;
      --warm-card: #fffaf0;
      --warm-border: #fde68a;
      --warm-shadow: 0 24px 70px rgba(146, 64, 14, 0.20);
    }
    body {
      background:
        radial-gradient(circle at 20% 12%, rgba(255, 255, 255, 0.90) 0, transparent 26%),
        radial-gradient(circle at 80% 8%, rgba(254, 240, 138, 0.65) 0, transparent 30%),
        linear-gradient(145deg, #fff7d1 0%, #ffed99 45%, #fbbf24 100%);
    }
    .hidden { display: none !important; }
    .btn-primary { background: linear-gradient(135deg, #f59e0b, #ea580c) !important; color: white !important; }
    .warm-shell { background: rgba(255, 250, 240, 0.86); backdrop-filter: blur(18px); }
    .warm-card { background: rgba(255, 255, 255, 0.92); border-color: rgba(253, 230, 138, 0.95); box-shadow: var(--warm-shadow); }
    .brand-icon { filter: drop-shadow(0 18px 22px rgba(146, 64, 14, 0.18)); }
    .quick-action {
      min-height: 68px;
      border-radius: 22px;
      border: 2px solid rgba(253, 230, 138, 0.95);
      background: rgba(255, 255, 255, 0.82);
      color: #92400e;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 24px rgba(146, 64, 14, 0.10);
      transition: transform .12s ease, background .12s ease;
    }
    .quick-action:active { transform: scale(0.97); }
    .quick-action:hover { background: #fff7ed; }
    .menu-day-card {
      border: 1px solid #fde68a;
      border-radius: 18px;
      background: #ffffff;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(146, 64, 14, .08);
    }
    .menu-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      background: #fffbeb;
      color: #92400e;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid #fde68a;
      margin: 2px;
    }
    @media (max-width: 480px) {
      .input-label { font-size: 1.1rem; }
      .form-input { height: 64px; font-size: 1.05rem; }
      .btn { height: 72px; font-size: 1.15rem; }
      .quick-action { min-height: 58px; font-size: 0.92rem; border-radius: 18px; }
    }
  </style>
</head>
<body>
  <div class="max-w-4xl mx-auto min-h-screen flex flex-col warm-shell shadow-2xl">
    <div class="flex justify-between items-center pt-4 px-4 sm:px-6">
      <div class="flex items-center gap-2 text-amber-900 font-black">
        <img src="/img/icon.png" alt="밥Check 아이콘" class="w-10 h-10 rounded-2xl brand-icon">
        <span>밥Check</span>
      </div>
      <a href="/scanner.html" class="bg-white/80 hover:bg-white text-amber-900 font-black py-2 px-3 rounded-2xl text-sm flex items-center gap-1 shadow-sm transition-colors border border-amber-100">
        📷 스캐너 열기
      </a>
    </div>

    <header class="pb-7 pt-6 px-5 text-center">
      <img src="/img/icon.png" alt="밥Check" class="w-28 h-28 mx-auto rounded-[2rem] brand-icon mb-4">
      <h1 class="text-4xl sm:text-5xl font-black text-amber-950 leading-tight">밥Check</h1>
      <p class="text-lg sm:text-xl text-amber-900/70 mt-3 break-keep font-bold">이름과 전화번호 뒷자리로 오늘의 점심 QR을 발급합니다</p>
    </header>

    <main class="flex-1 px-5 sm:px-6 pb-8 flex flex-col items-center justify-center">
      <div id="qr-form-container" class="w-full max-w-md p-6 sm:p-8 rounded-[2rem] border-2 warm-card">
        <div class="input-row">
          <label for="userName" class="input-label text-amber-950">이름</label>
          <input type="text" id="userName" class="form-input border-amber-100 bg-amber-50/50 focus:border-amber-400" placeholder="성함을 입력하세요" autocomplete="name">
        </div>

        <div class="input-row">
          <label for="phoneLast4" class="input-label text-amber-950">전화번호 뒷자리</label>
          <input type="text" id="phoneLast4" class="form-input border-amber-100 bg-amber-50/50 focus:border-amber-400" placeholder="숫자 4자리" maxlength="4" inputmode="numeric" autocomplete="off">
        </div>

        <button id="btn-generate-qr" class="btn btn-primary w-full mt-6 text-2xl h-20 rounded-3xl font-black shadow-xl shadow-orange-200/70">
          오늘의 점심 QR 생성
        </button>

        <div class="grid grid-cols-2 gap-3 mt-5">
          <button id="btn-open-menu" type="button" class="quick-action">
            🍱 식단표 보기
          </button>
          <button id="btn-add-shortcut" type="button" class="quick-action">
            📲 홈 화면 바로가기 추가
          </button>
        </div>
      </div>

      <div id="qrcode-container" class="hidden w-full max-w-md text-center p-6 sm:p-8 rounded-[2rem] border-2 warm-card">
        <div id="qrcode" class="flex justify-center p-5 bg-white border-4 border-amber-400 rounded-[2rem] shadow-2xl mb-6"></div>
        <h2 id="qr-result-name" class="text-3xl font-black text-amber-950 mb-2"></h2>
        <p class="text-amber-900/70 text-lg mb-6 font-bold">이 QR은 <span id="timer" class="text-red-500 font-black">03:00</span> 동안 유효합니다.</p>

        <button id="btn-reissue-qr" class="btn btn-primary w-full h-16 rounded-2xl font-black">QR 다시 발급받기</button>
        <button id="btn-back-to-form" type="button" class="w-full mt-3 h-14 rounded-2xl font-black text-amber-900 bg-amber-50 border-2 border-amber-200 hover:bg-amber-100 transition">
          QR 생성페이지로 돌아가기
        </button>
      </div>
    </main>

    <div id="menu-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
      <div class="bg-white rounded-[2rem] max-w-2xl w-full max-h-[86vh] overflow-hidden shadow-2xl border-4 border-amber-200">
        <div class="p-5 bg-amber-50 border-b border-amber-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h3 class="text-2xl font-black text-amber-950">🍱 식단표 보기</h3>
            <p class="text-sm text-amber-800/70 font-bold">날짜별 메뉴와 원산지를 확인할 수 있습니다.</p>
          </div>
          <button id="btn-close-menu" class="bg-white hover:bg-amber-100 border border-amber-200 text-amber-900 rounded-xl px-4 py-2 font-black">닫기</button>
        </div>
        <div class="p-5 border-b border-amber-100 flex flex-col sm:flex-row gap-3">
          <input type="month" id="menu-month" class="flex-1 bg-amber-50 border border-amber-200 rounded-2xl px-4 py-3 font-black text-amber-900 outline-none">
          <button id="btn-load-menu" class="bg-amber-500 hover:bg-amber-600 text-white rounded-2xl px-5 py-3 font-black shadow">식단 조회</button>
        </div>
        <div id="menu-list" class="p-5 space-y-3 overflow-y-auto max-h-[56vh] bg-amber-50/30">
          <div class="text-center text-amber-800 font-bold py-10">식단표를 불러오는 중입니다.</div>
        </div>
      </div>
    </div>

    <div id="ios-install-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
      <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl border-4 border-amber-100">
        <div class="text-4xl mb-2">🍎</div>
        <h3 class="text-xl font-extrabold text-gray-900 mb-2">아이폰 앱 설치 방법</h3>
        <p class="text-gray-500 text-sm mb-6">애플 정책상 아이폰은 아래 방법으로만<br>바탕화면 추가가 가능합니다.</p>
        <div class="bg-amber-50 rounded-2xl p-5 mb-6 text-left text-sm text-gray-700 leading-relaxed border border-amber-100">
          <p class="mb-3">1. 화면 하단 또는 주소창 옆 <b class="text-amber-700">[공유]</b> 아이콘을 누릅니다.</p>
          <p>2. 메뉴에서 <b class="text-amber-700">[홈 화면에 추가]</b>를 선택합니다.</p>
        </div>
        <button id="btn-close-ios-modal" class="btn btn-primary w-full h-14 rounded-2xl font-bold text-lg shadow-md shadow-orange-100">
          확인했습니다
        </button>
      </div>
    </div>

    <footer class="py-6 text-center text-amber-900/60 text-sm font-bold">
      © 화성오산교육지원청 기획경영과 2026. All rights reserved.
    </footer>
  </div>

  <script type="module" src="JS/qr_app.js?v=20260609"></script>
</body>
</html>
